# Creates the tag vX.Y.Z and a GitHub release from the VERSION file and CHANGELOG.md.
# Runs when the file VERSION changes on main, or by hand (Actions > Release > Run workflow).
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        run: |
          VER="$(tr -d ' \r\n' < VERSION)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '/^## /{f=($2==v)} f' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "Version ${{ steps.v.outputs.version }}" > notes.md
          cat notes.md

      - name: Create the release (if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
          else
            gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --notes-file notes.md --latest
          fi
